<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Z勇者塔 (Z-Tower)</title>
    <!-- 引入 Tailwind CSS 提供優雅的現代 UI 框架 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Inter & Press Start 2P 像素風字體 -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0b0f19;
            /* 禁用全域選取、系統選單與反彈效果 */
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            touch-action: none;
            /* 預留手機安全區域（Home Indicator / 手勢列 / 瀏覽器工具列） */
            padding-left: env(safe-area-inset-left);
            padding-right: env(safe-area-inset-right);
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
        }
        .pixel-font {
            font-family: 'Press Start 2P', monospace;
        }
        canvas {
            image-rendering: pixelated;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        /* 防止手機長按按鈕時產生半透明灰色高亮框 */
        button, div, canvas {
            -webkit-tap-highlight-color: transparent;
        }
        /* 手機虛擬按鍵：固定底部
           - 用 CSS 變數 --browser-chrome-offset 預留 Safari/Chrome 工具列空間
           - 預設至少 56px（約 Safari 底部列高度），再加上 Home Indicator
           - JS 會用 visualViewport 動態更新這個變數 */
        #virtual-keyboard {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 50;
            /* 核心：底部偏移 = 瀏覽器工具列預估高度 + 安全區域 */
            padding-bottom: calc(var(--browser-chrome-offset, 56px) + env(safe-area-inset-bottom, 0px));
            pointer-events: none; /* 容器不攔截觸控，僅按鈕可點 */
            transition: padding-bottom 0.15s ease-out;
        }
        #virtual-keyboard button {
            pointer-events: auto;
            touch-action: none;
            min-width: 52px;
            min-height: 52px;
        }
        /* 手機主內容預留底部空間（虛擬鍵高度約 100px + 工具列預留） */
        @media (max-width: 767px) {
            #main-game-wrapper {
                padding-bottom: calc(160px + var(--browser-chrome-offset, 56px) + env(safe-area-inset-bottom, 0px));
            }
            #screen-overlay {
                padding-bottom: calc(40px + var(--browser-chrome-offset, 56px) + env(safe-area-inset-bottom, 0px));
            }
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-4 text-white overflow-x-hidden">

<div id="main-game-wrapper" class="flex flex-col items-center justify-center w-full max-w-4xl gap-4">
    <!-- 頂部遊戲標題與計分板 -->
    <div class="w-full bg-slate-900/80 border border-slate-700/50 rounded-2xl p-4 flex flex-col md:flex-row justify-between items-center gap-4 backdrop-blur-md shadow-2xl">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center text-xl shadow-lg shadow-indigo-500/30">🏰</div>
            <div>
                <h1 class="text-lg font-bold tracking-wide text-indigo-400">Z勇者塔 (Z-Tower) <span id="ui-gamepad-status" class="text-xs text-emerald-400 font-normal ml-2 hidden">🎮 手把已連線</span></h1>
            </div>
        </div>
        <div class="flex items-center gap-6">
            <div class="text-center">
                <span class="text-xs uppercase text-slate-500 font-semibold block">目前樓層</span>
                <span id="ui-floor" class="pixel-font text-xl text-yellow-400 font-bold">0 F</span>
            </div>
            <div class="h-8 w-px bg-slate-700"></div>
            <div class="text-center">
                <span class="text-xs uppercase text-slate-500 font-semibold block">裝備狀態</span>
                <span id="ui-weapon" class="text-sm font-semibold text-slate-300">徒手 ✊</span>
            </div>
        </div>
    </div>

    <!-- 遊戲核心畫布 -->
    <div class="flex flex-col md:flex-row gap-4 w-full justify-center items-stretch">
        <div class="relative flex-1 flex justify-center items-center bg-black/40 rounded-2xl border border-slate-700/50 p-2 shadow-inner">
            <canvas id="gameCanvas" width="600" height="700" class="rounded-xl max-w-full h-auto shadow-2xl bg-slate-950"></canvas>
            
            <div id="screen-overlay" class="absolute inset-0 bg-slate-950/95 rounded-2xl flex flex-col items-center justify-center p-6 text-center z-20">
                <div class="pixel-font text-3xl text-yellow-500 mb-4 animate-pulse">Z-TOWER</div>
                <p class="text-slate-300 max-w-md text-sm mb-6 leading-relaxed">
                    這是一座由神祕代碼編織的百層高塔。踏上平滑的 Z 字階梯，踩踏或擊殺怪物向上前行！解鎖更高樓層，挑戰無盡魔物！
                </p>
                
                <div class="bg-slate-900/80 border border-slate-700 p-4 rounded-xl mb-6 text-left text-xs text-slate-400 space-y-2 w-full max-w-xs">
                    <div class="flex justify-between"><span>A / D 或 ◀▶</span> <span class="text-white">左右移動 / 順應爬行</span></div>
                    <div class="flex justify-between"><span>W / S 或 ▲▼</span> <span class="text-white">上下爬梯</span></div>
                    <div class="flex justify-between"><span>空白鍵 / 跳 按鈕</span> <span class="text-white">跳躍 / 落地踩怪</span></div>
                    <div class="flex justify-between"><span>K 鍵 / 攻擊 按鈕</span> <span class="text-white">攻擊 / 開箱 / 拾取 / 施法</span></div>
                    <div class="flex justify-between text-emerald-400 font-semibold"><span>📱 手機虛擬方向鍵</span> <span>底部固定操作</span></div>
                    <div class="flex justify-between text-yellow-500 font-semibold"><span class="flex items-center">🎮 支援手把</span> <span>隨插即玩</span></div>
                </div>

                <button id="btn-start" class="px-8 py-4 bg-gradient-to-r from-indigo-500 to-purple-600 hover:from-indigo-600 hover:to-purple-700 text-white font-bold rounded-xl shadow-lg shadow-indigo-500/30 hover:scale-105 transition duration-200">
                    進入高塔探索
